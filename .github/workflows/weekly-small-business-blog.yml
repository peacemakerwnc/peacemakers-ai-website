name: Weekly Small Business Blog Batch

on:
  schedule:
    # Mondays 9:00 AM US Eastern (14:00 UTC during EDT)
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_batch_id:
        description: "Optional batch ID to publish (4-7). Leave empty for auto-detect."
        required: false
        type: string
      deploy:
        description: "Deploy to Vercel production after generating HTML"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  publish-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine due batch
        id: batch
        env:
          FORCE_BATCH_ID: ${{ inputs.force_batch_id }}
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          schedule = json.loads(Path("peacemakers-ai/scripts/small-business-articles/batch-schedule.json").read_text())
          force = os.environ.get("FORCE_BATCH_ID", "").strip()
          today = date.today()
          batch = None
          if force:
              batch = next((b for b in schedule["batches"] if b["id"] == int(force)), None)
          else:
              for b in schedule["batches"]:
                  if b.get("status") == "published":
                      continue
                  if date.fromisoformat(b["scheduled_date"]) <= today:
                      batch = b
                      break

          out = Path(os.environ["GITHUB_OUTPUT"])
          if not batch:
              out.write_text("skip=true\n", encoding="utf-8")
              print("No due batch")
              raise SystemExit(0)

          module = batch.get("module", f"batch{batch['id']}.py")
          module_path = Path("peacemakers-ai/scripts/small-business-articles") / module
          lines = [
              "skip=false",
              f"batch_id={batch['id']}",
              f"batch_name={batch['name']}",
              f"scheduled={batch['scheduled_date']}",
              f"status={batch.get('status', 'pending')}",
              f"module={module}",
              f"module_missing={'true' if not module_path.exists() else 'false'}",
          ]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps(batch, indent=2))
          PY

      - name: Skip if nothing to publish
        if: steps.batch.outputs.skip == 'true' || steps.batch.outputs.status == 'published'
        run: echo "No unpublished due batch this week."

      - name: Open issue if article module is missing
        if: >-
          steps.batch.outputs.skip != 'true' &&
          steps.batch.outputs.status != 'published' &&
          steps.batch.outputs.module_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 peacemakers-ai/scripts/run-weekly-batch.py --write-prompt || true
          PROMPT_FILE="peacemakers-ai/scripts/small-business-articles/prompts/batch-${{ steps.batch.outputs.batch_id }}-prompt.md"
          BODY_FILE=/tmp/issue-body.md
          {
            echo "## Weekly AI for Small Business batch"
            echo
            echo "**Batch:** ${{ steps.batch.outputs.batch_id }} — ${{ steps.batch.outputs.batch_name }}"
            echo "**Scheduled:** ${{ steps.batch.outputs.scheduled }}"
            echo
            echo "Content module \`${{ steps.batch.outputs.module }}\` is missing. Generate it in Cursor, then re-run this workflow."
            echo
            echo '```'
            [ -f "$PROMPT_FILE" ] && cat "$PROMPT_FILE" || echo "Prompt file not found"
            echo '```'
          } > "$BODY_FILE"
          gh issue create \
            --title "Blog batch ${{ steps.batch.outputs.batch_id }} due (content missing): ${{ steps.batch.outputs.batch_name }}" \
            --label "blog-batch" \
            --body-file "$BODY_FILE" || true

      - name: Publish due batch (mark + HTML + sitemap)
        if: >-
          steps.batch.outputs.skip != 'true' &&
          steps.batch.outputs.status != 'published' &&
          steps.batch.outputs.module_missing == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          SHOULD_DEPLOY: ${{ inputs.deploy == true || github.event_name == 'schedule' }}
        run: |
          ARGS=(--force-batch "${{ steps.batch.outputs.batch_id }}")
          if [ "$SHOULD_DEPLOY" = "true" ] && [ -n "$VERCEL_TOKEN" ]; then
            export VERCEL_SCOPE="${VERCEL_SCOPE:-peacemakers-ai}"
            python3 peacemakers-ai/scripts/publish-due-batch.py "${ARGS[@]}" --deploy
          else
            echo "Publishing content locally in the runner (deploy skipped or VERCEL_TOKEN missing)."
            python3 peacemakers-ai/scripts/publish-due-batch.py "${ARGS[@]}"
          fi

      - name: Commit published site updates
        if: >-
          steps.batch.outputs.skip != 'true' &&
          steps.batch.outputs.status != 'published' &&
          steps.batch.outputs.module_missing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peacemakers-ai/scripts/small-business-articles/batch-schedule.json \
                  peacemakers-ai/resources/ai-for-small-business \
                  peacemakers-ai/sitemap.xml \
                  peacemakers-ai/resources.html || true
          if git diff --staged --quiet; then
            echo "No file changes to commit"
          else
            git commit -m "Publish AI for Small Business blog batch ${{ steps.batch.outputs.batch_id }}"
            git push
          fi
