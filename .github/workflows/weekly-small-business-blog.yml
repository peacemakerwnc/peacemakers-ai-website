name: Every-Other-Day Small Business Blog Article

on:
  schedule:
    # Every day at 9:00 AM US Eastern (13:00 UTC EST / 14:00 UTC EDT).
    # Publisher only emits when an unpublished article has scheduled_date <= today
    # Continuity = every other day; Implementation Tool Stack = weekly Mondays from Oct 5, 2026.
    # Cadence lives in batch-schedule.json articles[]. Publisher no-ops when nothing is due.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force_slug:
        description: "Optional article slug to publish. Leave empty for auto-detect."
        required: false
        type: string
      deploy:
        description: "Deploy to Vercel production after generating HTML"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine due article
        id: article
        env:
          FORCE_SLUG: ${{ inputs.force_slug }}
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          schedule = json.loads(Path("peacemakers-ai/scripts/small-business-articles/batch-schedule.json").read_text())
          force = os.environ.get("FORCE_SLUG", "").strip()
          today = date.today()
          art = None
          articles = schedule.get("articles") or []
          if force:
              art = next((a for a in articles if a["slug"] == force), None)
          else:
              for a in articles:
                  if a.get("status") == "published":
                      continue
                  if date.fromisoformat(a["scheduled_date"]) <= today:
                      art = a
                      break

          out = Path(os.environ["GITHUB_OUTPUT"])
          if not art:
              out.write_text("skip=true\n", encoding="utf-8")
              print("No due article")
              raise SystemExit(0)

          module = art.get("module", "")
          module_path = Path("peacemakers-ai/scripts/small-business-articles") / module
          lines = [
              "skip=false",
              f"slug={art['slug']}",
              f"scheduled={art['scheduled_date']}",
              f"status={art.get('status', 'pending')}",
              f"module={module}",
              f"module_missing={'true' if not module_path.exists() else 'false'}",
          ]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(json.dumps(art, indent=2))
          PY

      - name: Skip if nothing to publish
        if: steps.article.outputs.skip == 'true' || steps.article.outputs.status == 'published'
        run: echo "No unpublished due article today."

      - name: Open issue if article module is missing
        if: >-
          steps.article.outputs.skip != 'true' &&
          steps.article.outputs.status != 'published' &&
          steps.article.outputs.module_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE=/tmp/issue-body.md
          {
            echo "## Every-other-day AI for Small Business article"
            echo
            echo "**Slug:** \`${{ steps.article.outputs.slug }}\`"
            echo "**Scheduled:** ${{ steps.article.outputs.scheduled }}"
            echo
            echo "Content module \`${{ steps.article.outputs.module }}\` is missing."
          } > "$BODY_FILE"
          gh issue create \
            --title "Blog article due (content missing): ${{ steps.article.outputs.slug }}" \
            --label "blog-batch" \
            --body-file "$BODY_FILE" || true

      - name: Publish due article (mark + HTML + sitemap)
        if: >-
          steps.article.outputs.skip != 'true' &&
          steps.article.outputs.status != 'published' &&
          steps.article.outputs.module_missing == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          SHOULD_DEPLOY: ${{ inputs.deploy == true || github.event_name == 'schedule' }}
        run: |
          ARGS=(--force-slug "${{ steps.article.outputs.slug }}")
          if [ "$SHOULD_DEPLOY" = "true" ] && [ -n "$VERCEL_TOKEN" ]; then
            export VERCEL_SCOPE="${VERCEL_SCOPE:-peacemakers-ai}"
            python3 peacemakers-ai/scripts/publish-due-batch.py "${ARGS[@]}" --deploy
          else
            echo "Publishing content locally in the runner (deploy skipped or VERCEL_TOKEN missing)."
            python3 peacemakers-ai/scripts/publish-due-batch.py "${ARGS[@]}"
          fi

      - name: Commit published site updates
        if: >-
          steps.article.outputs.skip != 'true' &&
          steps.article.outputs.status != 'published' &&
          steps.article.outputs.module_missing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peacemakers-ai/scripts/small-business-articles/batch-schedule.json \
                  peacemakers-ai/resources/ai-for-small-business \
                  peacemakers-ai/sitemap.xml \
                  peacemakers-ai/resources.html || true
          if git diff --staged --quiet; then
            echo "No file changes to commit"
          else
            git commit -m "Publish AI for Small Business article ${{ steps.article.outputs.slug }}"
            git push
          fi
